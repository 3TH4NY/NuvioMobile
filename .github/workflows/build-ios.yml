name: Build Nuvio iOS IPA
on: [workflow_dispatch]

env:
  ORG_GRADLE_PROJECT_nuvio.android.distribution: full

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle Execution Rights
        run: chmod +x gradlew

      - name: Compile and Build Xcode Project
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Sideloadable IPA Package
        run: |
          mkdir -p iosApp/build/Payload
          mv iosApp/build/Release-iphoneos/iosApp.app iosApp/build/Payload/Nuvio.app
          cd iosApp/build
          zip -r Nuvio.ipa Payload

      - name: Upload Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Official-Build
          path: iosApp/build/Nuvio.ipa
